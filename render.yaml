# Render deployment configuration for Surgical Tool Tracking Backend
services:
  - type: web
    name: surgical-tool-tracking-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DETECTION_SOURCE
        value: replay
      - key: DISABLE_HAND_CAMERA
        value: "1"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
